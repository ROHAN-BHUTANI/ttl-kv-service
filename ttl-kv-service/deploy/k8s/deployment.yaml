apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttl-kv
  labels: {app: ttl-kv}
spec:
  replicas: 3
  selector:
    matchLabels: {app: ttl-kv}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: ttl-kv}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: ttl-kv
          image: ttl-kv:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
